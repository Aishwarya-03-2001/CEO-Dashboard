<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViN cortex — CEO Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ViN brand — Cortex green leads; navy, sky, lime, red are supporting accents */
  --cortex:#3AAA60; --cortex-deep:#1F7F43; --cortex-soft:#E9F6EE; --cortex-tint:#F3FAF6;
  --navy:#2E3591; --sky:#51AEE5;
  --ink:#171A2C; --ink-2:#424760; --muted:#7C8197; --faint:#A9ADBD;
  --line:rgba(23,26,44,.08); --line-2:rgba(23,26,44,.05);
  --ok:#43B56E; --ok-soft:#DFF3E6;
  --warn:#EDA930; --warn-soft:#FCF0D9; --warn-ink:#A86A07;
  --bad:#E5483B; --bad-soft:#FCE4E1; --bad-ink:#B62E22;
  --glass:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(23,26,44,.04),0 10px 30px rgba(23,26,44,.06);
  --r:20px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:#FBFCFB;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
body::before{width:620px;height:620px;right:-160px;top:-260px;background:radial-gradient(circle,rgba(58,170,96,.18),transparent 65%)}
body::after{width:560px;height:560px;left:-220px;bottom:-240px;background:radial-gradient(circle,rgba(58,170,96,.12),transparent 65%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Header */
header{position:sticky;top:0;z-index:30;background:rgba(251,252,251,.78);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--line-2)}
.hd{max-width:1360px;margin:0 auto;padding:14px 36px;display:flex;align-items:center;gap:20px}
.logo{height:38px;display:block;cursor:pointer}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:18px}
.sources{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.sources span{display:inline-flex;align-items:center;gap:6px}
.sources i{width:6px;height:6px;border-radius:50%;background:var(--cortex);box-shadow:0 0 0 3px rgba(58,170,96,.15)}
.when{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);padding-left:18px;border-left:1px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--cortex);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.me b{font-size:13px;display:block;line-height:1.2}
.me span{font-size:11.5px;color:var(--muted)}

main{max-width:1360px;margin:0 auto;padding:28px 36px 80px}
.page{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow),inset 0 0 0 1px var(--line-2);border-radius:var(--r)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.card-h h2{font-size:19px;font-weight:600;letter-spacing:-.015em}
.card-h p{font-size:13px;color:var(--muted);margin-top:2px}

/* Overview hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:24px}
.hero h1{font-size:44px;line-height:1.08;letter-spacing:-.035em;font-weight:700}
.hero .sub{font-size:19px;color:var(--ink-2);margin-top:6px}
.ai{display:flex;gap:16px;align-items:flex-start;padding:20px 22px;margin-top:22px;background:linear-gradient(120deg,rgba(233,246,238,.9),rgba(255,255,255,.75));border-radius:18px;border:1px solid rgba(58,170,96,.18)}
.ai .sp{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--cortex);box-shadow:0 2px 8px rgba(58,170,96,.15);flex-shrink:0}
.ai b{display:block;font-size:17px;color:var(--cortex-deep);letter-spacing:-.01em}
.ai span{font-size:14px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:18px 18px 16px}
.stat .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.si.g{background:var(--cortex-soft);color:var(--cortex)}
.si.r{background:var(--bad-soft);color:var(--bad)}
.si.a{background:var(--warn-soft);color:var(--warn-ink)}
.si.n{background:#ECEDF7;color:var(--navy)}
.stat.alert{background:linear-gradient(160deg,rgba(252,228,225,.55),rgba(255,255,255,.75))}

.row2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin-bottom:24px}

/* Graph */
.graph{padding:22px 24px 18px}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--cortex-soft);color:var(--cortex-deep);white-space:nowrap}
.verdict i{width:7px;height:7px;border-radius:50%;background:var(--cortex)}
.chart{position:relative;margin-top:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:8px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.chart .tip b{display:block;font-size:11px;color:#B9BED6;font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg-line{width:18px;height:0;border-top:2.5px solid var(--cortex)}
.lg-line.plan{border-top:2px dashed #B7BBCB}
.lg-line.fc{border-top:2.5px dotted var(--cortex)}
.takeaway{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2);display:flex;gap:10px;font-size:13.5px;color:var(--ink-2)}
.takeaway .ico{color:var(--cortex);margin-top:2px}

/* Insights */
.ins{padding:22px 22px 14px;display:flex;flex-direction:column}
.ins-list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.insight{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-radius:16px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;border:1px solid transparent;text-align:left;width:100%}
.insight.bad{background:linear-gradient(110deg,rgba(252,228,225,.7),rgba(255,255,255,.6))}
.insight.warn{background:linear-gradient(110deg,rgba(252,240,217,.75),rgba(255,255,255,.6))}
.insight:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(23,26,44,.07);border-color:rgba(255,255,255,.9)}
.insight .ii{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;flex-shrink:0}
.insight.bad .ii{color:var(--bad)} .insight.warn .ii{color:var(--warn-ink)}
.insight h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.insight p{font-size:13px;color:var(--ink-2);margin-top:2px}
.insight .meta{font-size:11.5px;color:var(--muted);margin-top:6px}
.insight .chev{margin-left:auto;color:var(--faint);margin-top:10px;transition:transform .15s}
.insight:hover .chev{transform:translateX(2px);color:var(--ink)}
.quiet{margin-top:auto;padding-top:12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.quiet button{color:var(--cortex-deep);font-weight:600}




/* Insight: main + action side panel */
.idet2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:24px;align-items:start}
.idet2 .main{display:flex;flex-direction:column;gap:16px}
.actside{position:sticky;top:84px}
.actside h4,.evflat h4{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.evflat h4 span{text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px}
.evrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.evrow:first-of-type{border-top:0;padding-top:0}
.evrow b{display:block;font-size:14px;font-weight:600}
.evrow .s{display:block;font-size:12.5px;color:var(--muted)}
.evrow .kv{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
.evrow .kv em{font-style:normal;color:var(--ink-2)}
.pchip.full{display:flex;width:100%;border-radius:14px;padding:10px 12px;text-align:left;gap:12px}
.pchip.full i{width:32px;height:32px;font-size:11px}
.pchip.full b{display:block;font-size:14px}
.pchip.full small{display:block}
.pchip.full .chev{margin-left:auto}
.idet2 .box{padding:24px 26px}
@media(max-width:900px){.idet2{grid-template-columns:1fr}.actside{position:static}}


/* Business sections + heatmap legend */
.plist{margin-top:0}
.legend{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 24px 6px}
.keys i{display:inline-block}
.biz{padding:22px 24px;margin-bottom:24px}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.row2b .biz{margin-bottom:0}
.rev{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:28px;align-items:end;margin-top:20px}
.revk{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.revk b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.revk b.neg{color:var(--bad-ink)}
.revk span{font-size:12.5px;color:var(--muted)}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;height:130px;align-items:end}
.mb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.mbar{position:relative;flex:1;width:100%;display:flex;align-items:flex-end}
.mbar i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--ok)}
.mbar i.f{background:repeating-linear-gradient(135deg,rgba(67,181,110,.55) 0 3px,rgba(67,181,110,.2) 3px 6px)}
.mbar u{position:absolute;left:-2px;right:-2px;height:0;border-top:2px solid var(--ink);text-decoration:none;opacity:.55}
.mb span{font-size:11px;color:var(--faint)}
.legend2{display:flex;gap:16px;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}
.legend2 i{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--ok);margin-right:5px}
.legend2 i.f{background:repeating-linear-gradient(135deg,rgba(67,181,110,.55) 0 3px,rgba(67,181,110,.2) 3px 6px)}
.legend2 u{display:inline-block;width:12px;border-top:2px solid var(--ink);opacity:.55;margin-right:5px;vertical-align:middle}
.legend2 em{margin-left:auto;font-style:normal}
.clist{margin-top:14px}
.cr{display:grid;grid-template-columns:150px 1fr 70px;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2)}
.cr:first-child{border-top:0}
.cn b{display:block;font-size:13.5px;font-weight:600}.cn span{font-size:11.5px;color:var(--muted)}
.cr .trk{height:8px;border-radius:99px;background:rgba(23,26,44,.07);overflow:hidden}
.cr .trk i{display:block;height:100%;background:var(--cortex);border-radius:99px}
.cv{text-align:right}.cv b{display:block;font-size:13px}.cv span{font-size:11.5px;color:var(--muted)}
.note{font-size:13px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.cmp{display:grid;grid-template-columns:auto 1fr auto 16px;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line-2)}
.cmp:first-child{border-top:0}
.cmp:hover{background:rgba(58,170,96,.04)}
.cmp b{display:block;font-size:13.5px}.cmp div span{display:block;font-size:12px;color:var(--muted)}
.cmp small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cmp .chev{color:var(--faint)}
@media(max-width:900px){.row2b,.rev{grid-template-columns:1fr}}


/* Hash map view */
.hmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:4px 24px 12px}
.htile{border:1px solid var(--line);border-left-width:4px;border-radius:14px;padding:14px 16px;background:#fff;cursor:pointer;transition:box-shadow .15s}
.htile:hover{box-shadow:0 4px 14px rgba(23,26,44,.08)}
.htile.g{border-left-color:var(--ok)}.htile.a{border-left-color:var(--warn)}.htile.r{border-left-color:var(--bad)}
.htile dl{display:grid;grid-template-columns:104px 1fr;gap:7px 10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);font-size:13px;align-items:center}
.htile dt{color:var(--muted)}.htile dd{font-weight:500;min-width:0}
.htile .pbar{display:flex;align-items:center;gap:8px}.htile .pbar .trk{flex:1}
.htile em.late{font-style:normal;color:var(--bad-ink);font-size:12px;font-weight:600}


/* Gantt view */
.tr.gantt{grid-template-columns:240px minmax(560px,1fr)}
.gtbl{min-width:860px}
.ms{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);background:var(--faint);border:1.5px solid #fff;z-index:3}
.ms.done{background:var(--ok)}.ms.risk{background:var(--bad)}


.gw .prow{cursor:pointer}
.gchev{margin-left:auto;color:var(--faint);transition:transform .2s;display:flex}
.gw.open .gchev{transform:rotate(90deg)}
.gw.open .prow{background:rgba(58,170,96,.06)}
.gdet{display:none;grid-template-columns:1.1fr .8fr .9fr 1.6fr;gap:22px;padding:18px 24px 16px;background:rgba(23,26,44,.02);border-bottom:1px solid var(--line-2)}
.gw.open .gdet{display:grid}
.gdet h5{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.gdet .hl{display:grid;gap:5px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.gdet .hl span{display:flex;align-items:center;gap:7px}.gdet .hl b{margin-left:auto;color:var(--ink-2);font-weight:500}
.gdet .hl i{width:8px;height:8px;border-radius:50%}.hl i.g{background:var(--ok)}.hl i.a{background:var(--warn)}.hl i.r{background:var(--bad)}
.gp{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.gdet .trk{height:8px;border-radius:99px;background:rgba(23,26,44,.07);overflow:hidden}
.gdet .trk i{display:block;height:100%;border-radius:99px;background:var(--ok)}.gdet .trk i.a{background:var(--warn)}.gdet .trk i.r{background:var(--bad)}
.gd{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.gd span{color:var(--muted)}.gd b.late,small.late{color:var(--bad-ink)}
.gdet small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.gdet p{font-size:13.5px;color:var(--ink-2)}.gdet p.ok{color:var(--cortex-deep)}
.gdet ul{margin:8px 0 0 16px;font-size:13px;color:var(--ink-2)}
.gnext{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--cortex-soft);color:var(--cortex-deep);font-size:12.5px;font-weight:500}
.gms{grid-column:1/-1;padding-top:14px;border-top:1px solid var(--line-2)}
.mlist{display:flex;flex-wrap:wrap;gap:8px}
.mi{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--muted)}
.mi i{width:7px;height:7px;transform:rotate(45deg);background:var(--faint)}.mi.done i{background:var(--ok)}.mi.risk i{background:var(--bad)}
.mi b{color:var(--ink);font-weight:600}.mi em{font-style:normal;color:var(--bad-ink)}
.gfoot{grid-column:1/-1;display:flex;gap:22px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.gfoot b{color:var(--ink);font-weight:600;margin-left:4px}.gfoot .btn{margin-left:auto}
@media(max-width:900px){.gdet{grid-template-columns:1fr 1fr}}


/* Gantt date drill-down */
.gw .tl{cursor:crosshair}
.selmark{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--navy);z-index:4;pointer-events:none}
.selmark::before{content:"";position:absolute;top:-1px;left:-5px;width:8px;height:8px;border-radius:50%;background:var(--navy)}
.hov{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(23,26,44,.35);z-index:5;pointer-events:none;display:none}
.hov.on{display:block}
.hov span{position:absolute;top:2px;left:6px;background:var(--ink);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;white-space:nowrap}
.gdate{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gdate>div{display:flex;align-items:baseline;gap:10px}
.gdate .dl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gdate b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.gdate em{font-style:normal;font-size:12.5px;color:var(--muted)}
.gdate .btn{margin-left:auto}
.gnear{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;background:var(--cortex-soft);color:var(--cortex-deep);font-size:13px;font-weight:500}
.gnear.risk{background:var(--bad-soft);color:var(--bad-ink)}
.gnear i{width:8px;height:8px;transform:rotate(45deg);background:currentColor;flex-shrink:0}
.pp{display:grid;grid-template-columns:78px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.pp b{color:var(--ink);text-align:right}
.vr{font-weight:600}.vr.g{color:var(--cortex-deep)}.vr.a{color:var(--warn-ink)}.vr.r{color:var(--bad-ink)}
.mi.hit{border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,38,92,.12)}
.gdet{grid-template-columns:1fr 1fr 1fr 1.2fr}
@media(max-width:900px){.gdet{grid-template-columns:1fr 1fr}}


/* Sidebar */
body{padding-left:248px}
.sb{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:40;padding:18px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.sb-logo{padding:2px 8px 18px}.sb-logo img{height:36px;display:block;cursor:pointer}
.hd .logo{display:none}
.sb-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:6px 10px}
.sbi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:background .15s}
.sbi:hover{background:rgba(23,26,44,.05)}
.sbi.on{background:var(--cortex-soft);color:var(--cortex-deep);font-weight:600}
.sbi .ico{width:19px;height:19px;flex-shrink:0}
.sbi span{flex:1;line-height:1.25}
.sbi em{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn-ink)}
.sbi em.r{background:var(--bad-soft);color:var(--bad-ink)}
.pg-h{margin-bottom:22px}.pg-h h1{font-size:28px;font-weight:700;letter-spacing:-.025em}.pg-h .sub{color:var(--muted);margin-top:4px}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.vall{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:13px;font-weight:600;color:var(--cortex-deep);cursor:pointer}
.vall .chev{width:14px;height:14px}
.cmp.big{padding:16px 4px}.cmp .ctx{margin-top:3px;font-size:12px;color:var(--faint)}

.mn i{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex-shrink:0}
.msr.done .mn i{background:var(--cortex);border-color:var(--cortex);color:#fff}
.msr.risk .mn i{border-color:var(--bad);background:var(--bad-soft)}
.msr.watch .mn i{border-color:var(--warn);background:var(--warn-soft)}
.msr.done .mn{color:var(--muted)}
.mtrack{position:relative;height:100%}
.mline{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line)}
.mdone{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;background:var(--cortex);opacity:.5}
.mtoday{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--cortex)}
.mtoday.lbl::before{content:"Today";position:absolute;top:-14px;left:-14px;font-size:10.5px;font-weight:600;color:var(--cortex-deep)}
.mdot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2px solid var(--faint)}
.mdot.done{background:var(--cortex);border-color:var(--cortex)}
.mdot.risk{background:var(--bad);border-color:var(--bad)}
.mdot.watch{background:var(--warn);border-color:var(--warn)}
.mghost{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px dashed var(--muted);background:#fff}
.mslip{position:absolute;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(135deg,var(--bad) 0 3px,rgba(229,72,59,.25) 3px 6px);border-radius:2px}
.mslip.watch{background:repeating-linear-gradient(135deg,var(--warn) 0 3px,rgba(237,169,48,.25) 3px 6px)}
.md{font-size:12.5px;color:var(--muted);text-align:right}
.md em{font-style:normal;font-weight:600;color:var(--bad-ink)}
.md em.watch{color:var(--warn-ink)}
@media (max-width:760px){.msr{grid-template-columns:1fr 90px;height:auto;padding:8px 0}.mtrack{display:none}}

/* Comment to PM */
.note{padding:22px 22px 18px;position:sticky;top:92px}
.to{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:14px;background:rgba(23,26,44,.03)}
.to b{display:block;font-size:14px}
.to span{font-size:12px;color:var(--muted)}
.to .st{margin-left:auto;font-size:11.5px;color:var(--cortex-deep);display:flex;align-items:center;gap:5px;font-weight:500}
.to .st i{width:6px;height:6px;border-radius:50%;background:var(--cortex)}
.thread{margin-top:14px;display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto}
.msg{display:flex;gap:10px}
.msg .av{width:28px;height:28px;font-size:11px}
.msg .av.pm{background:#ECEDF7;color:var(--navy)}
.bubble{flex:1;padding:10px 12px;border-radius:4px 14px 14px 14px;background:rgba(23,26,44,.04);font-size:13.5px}
.msg.mine .bubble{background:var(--cortex-soft)}
.bubble .bh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.bubble .bh b{color:var(--ink-2);font-weight:600}
.bubble .ctx{display:inline-block;font-size:11px;font-weight:600;color:var(--cortex-deep);background:#fff;padding:1px 7px;border-radius:6px;margin-bottom:4px}
.bubble .sent{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--cortex-deep);margin-top:4px}
.compose{margin-top:14px}
.ctxchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 6px 4px 10px;border-radius:999px;background:var(--cortex-soft);color:var(--cortex-deep);margin-bottom:8px}
.ctxchip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.ctxchip button:hover{background:rgba(255,255,255,.7)}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
textarea:focus{border-color:var(--cortex);box-shadow:0 0 0 4px rgba(58,170,96,.12)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:rgba(255,255,255,.7);transition:all .15s}
.quick button:hover{border-color:var(--cortex);color:var(--cortex-deep)}
.send-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.send-row label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.send-row input[type=checkbox]{accent-color:var(--cortex)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.8);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:rgba(23,26,44,.18);background:#fff}
.btn.primary{background:var(--cortex);border-color:var(--cortex);color:#fff}
.btn.primary:hover{background:var(--cortex-deep);border-color:var(--cortex-deep)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.done{background:var(--cortex-soft);border-color:transparent;color:var(--cortex-deep)}
.send-row .btn.primary{margin-left:auto}
.human{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-top:12px}
.people{margin-top:6px}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.person:first-child{border-top:0}
.person .av{width:32px;height:32px;font-size:11.5px;background:#ECEDF7;color:var(--navy)}
.person b{display:block;font-size:13.5px}
.person span{font-size:12px;color:var(--muted)}
.person .flag{margin-left:auto;font-size:11.5px;font-weight:600}
.collapsed-note{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Insight detail */
.idet{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.ihead{margin-bottom:22px}
.ihead h1{font-size:34px;letter-spacing:-.03em;font-weight:700;margin-top:10px;line-height:1.15}
.ihead p{font-size:17px;color:var(--ink-2);margin-top:8px;max-width:760px}
.sec{padding:20px 0;border-top:1px solid var(--line-2)}
.sec:first-child{border-top:0;padding-top:4px}
.sec h4{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.sec p{font-size:15.5px}
.sec .big{font-size:20px;font-weight:600;letter-spacing:-.015em}
.ev{display:flex;flex-direction:column;gap:8px}
.evi{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.6)}
.evi > button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.evi > button:hover{background:rgba(23,26,44,.02)}
.src{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;flex-shrink:0;min-width:48px;text-align:center}
.src.odoo{background:#F1EBF6;color:#714B85}
.src.email{background:#E6F2FB;color:#1F6FA6}
.src.project{background:#ECEDF7;color:var(--navy)}
.evi b{display:block;font-size:14px;font-weight:600}
.evi span.s{font-size:12.5px;color:var(--muted)}
.evi .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.evi.open .chev{transform:rotate(90deg)}
.evi dl{display:none;grid-template-columns:140px 1fr;gap:6px 14px;padding:12px 16px 14px;border-top:1px solid var(--line-2);font-size:13px;background:rgba(23,26,44,.015)}
.evi.open dl{display:grid}
.evi dt{color:var(--muted)} .evi dd{color:var(--ink-2)}
.corr{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--cortex-deep)}
.side{display:flex;flex-direction:column;gap:24px}
.aff{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line-2);margin-top:10px;cursor:pointer;transition:background .15s}
.aff:hover{background:rgba(58,170,96,.05)}
.aff b{display:block;font-size:14px}
.aff span{font-size:12px;color:var(--muted)}
.aff .chev{margin-left:auto;color:var(--faint)}
.act{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.act .btn{justify-content:center}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;opacity:0;transition:all .25s;z-index:60;pointer-events:none;box-shadow:0 12px 40px rgba(23,26,44,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ico{color:#7FD9A0}

@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .row2,.pgrid,.idet{grid-template-columns:1fr}
  .note{position:static}
  .health{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .hd{padding:12px 18px;gap:12px}
  .sources,.me div{display:none}
  .when{border:0;padding:0;font-size:12px}
  main{padding:22px 18px 60px}
  .hero h1{font-size:34px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .health{grid-template-columns:repeat(2,1fr)}
  .impact{grid-template-columns:1fr}
  .ph h1,.ihead h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function ganttRows(rows){
  const grid=`<div class="grid" style="grid-template-columns:repeat(${MONTHS.length},1fr)">${MONTHS.map(()=>'<i></i>').join('')}</div>`;
  const body=rows.map((p,i)=>{
    const o=p.h.overall, L=pct(p.start), R=pct(p.end), F=pct(p.fc), late=p.fc>p.end;
    const days=Math.round((p.fc-p.end)/864e5);
    const ms=(p.milestones||[]).map(m=>`<span class="ms ${m[2]}" style="left:${pct(m[3]||m[1])}%" title="${m[0]} · ${fmt(m[1])}${m[3]?' → '+fmt(m[3]):''}"></span>`).join('');
    return `<div class="gw ${state.open[p.id]?'open':''}" data-id="${p.id}"><div class="tr gantt prow ${o!=='g'?'flag':''} ${o==='a'?'w':''}" data-gx="${p.id}">
      <div class="pn"><div class="ini">${p.ini}</div><div><b>${p.name}</b><span>${p.owner} · ${OVER[o][1]} · ${p.progress}%</span></div><span class="gchev">${I.chev}</span></div>
      <div class="tl">${grid}
        <div class="bar-plan" style="left:${L}%;width:${R-L}%"></div>
        <div class="bar-fc ${o!=='g'?o:''}" style="left:${L}%;width:${R-L}%"><i style="width:${p.progress}%"></i></div>
        ${late?`<div class="slip ${o==='a'?'a':''}" style="left:${R}%;width:${F-R}%"></div><div class="slip-l ${o==='a'?'a':''}" style="left:${F}%">+${days}d</div>`:''}
        ${ms}
        <div class="today ${i===0?'lbl':''}" style="left:${pct(TODAY)}%"></div>
        <div class="selmark" style="left:${pct(new Date(state.sel[p.id]||TODAY))}%;display:${state.sel[p.id]?'block':'none'}"></div>
        <div class="hov"><span></span></div>
      </div></div>${ganttDetail(p)}</div>`}).join('');
  return `<div class="tbl-wrap"><div class="tbl gtbl">
    <div class="tr gantt th"><div>Project</div>
      <div class="months" style="grid-template-columns:repeat(${MONTHS.length},1fr)">${MONTHS.map(m=>`<span>${m}</span>`).join('')}</div></div>
    ${body}
    <div class="legend"><div class="keys"><span><i style="background:var(--ok)"></i>Progress</span><span><i style="background:rgba(23,26,44,.06);border:1px dashed rgba(23,26,44,.25)"></i>Planned dates</span><span><i style="background:repeating-linear-gradient(135deg,var(--bad) 0 3px,rgba(229,72,59,.25) 3px 6px)"></i>Forecast slip</span><span><i style="width:8px;height:8px;transform:rotate(45deg);background:var(--faint)"></i>Milestone</span><span><i style="width:2px;background:var(--cortex)"></i>Today</span></div></div>
  </div></div>`;
}
const flt={q:'',status:'all',owner:'all',sort:'risk'};
const escA=v=>String(v).replace(/"/g,'&quot;');
const src=(t)=>`<span class="srct"><i></i>${t} · as of 10:42</span>`;
function filteredProjects(){
  const order={r:0,a:1,g:2}, q=flt.q.trim().toLowerCase();
  let rows=PROJECTS.filter(p=>(!q||[p.name,p.owner,p.client].some(x=>x.toLowerCase().includes(q)))
    &&(flt.owner==='all'||p.owner===flt.owner)
    &&(flt.status==='all'||(flt.status==='attention'?p.h.overall!=='g':p.h.overall==='g')));
  const by={risk:(a,b)=>order[a.h.overall]-order[b.h.overall]||(b.fc-b.end)-(a.fc-a.end),
    progress:(a,b)=>a.progress-b.progress, finish:(a,b)=>a.fc-b.fc, slip:(a,b)=>(b.fc-b.end)-(a.fc-a.end)};
  return rows.sort(by[flt.sort]);
}
const filtersActive=()=>flt.q.trim()||flt.status!=='all'||flt.owner!=='all'||flt.sort!=='risk';

const PAGE_SIZE=6;
function pager(total,page,size,attr){
  const n=Math.ceil(total/size); if(n<=1) return '';
  const from=(page-1)*size+1, to=Math.min(total,page*size);
  return `<div class="pager"><span>Showing ${from}–${to} of ${total}</span><div>
    <button ${attr}="${page-1}" ${page===1?'disabled':''}>Previous</button>
    ${Array.from({length:n},(_,i)=>`<button ${attr}="${i+1}" class="${i+1===page?'on':''}">${i+1}</button>`).join('')}
    <button ${attr}="${page+1}" ${page===n?'disabled':''}>Next</button></div></div>`;
}
function portfolioBody(){
  const rows=filteredProjects();

  return (state.view==='hashmap'?hashmapTiles(part):ganttRows(part))+pager(rows.length,state.page,PAGE_SIZE,'data-pg');
}

    ${NAV.map(n=>`<a class="sbi ${n[0]===active?'on':''}" data-go="${n[2]}"><svg class="ico" viewBox="0 0 24 24">${n[3]}</svg><span>${n[1]}</span>${badge[n[0]]?`<em class="${n[0]==='complaints'?'r':''}">${badge[n[0]]}</em>`:''}</a>`).join('')}`;
}
function renderOverview(){
  const att=PROJECTS.filter(p=>p.h.overall!=='g').length;
  $('#app').innerHTML=`<div class="page">
  <section class="hero">
    <div>
      <h1>Good morning, Pravin.</h1>
      <div class="sub">Here's your project portfolio at a glance.</div>
      <div class="ai"><div class="sp">${I.spark}</div><div><b>Business is stable, with ${att} projects that need your attention.</b><span>Material delays and one cost variance are the key risks this week.</span></div></div>
    </div>
    <div class="stats">
      ${stat(I.layers,'g',PROJECTS.length,'Active projects')}
      ${stat(I.checkB,'g',PROJECTS.length-att,'On track')}
      ${stat(I.warn,'r',att,'Need attention','alert')}
      ${stat(I.coin,'n','$41.4M','Portfolio value')}
    </div>
  </section>

  ${revenueCard()}
  <div class="row2b">${customersCard()}${complaintsCard()}</div>

  <section class="row1">
    <div class="glass ins">
      <div class="card-h"><div><h2>${I.spark.replace('class="ico"','class="ico" style="display:inline;vertical-align:-2px;color:var(--cortex);margin-right:6px"')}Needs your attention</h2><p>Only risks that can change a delivery date, cost or client outcome.</p>${src('Odoo + Email')}</div></div>
      <div class="ins-list">${ATTENTION.map(id=>{const x=INSIGHTS[id];return `
        <button class="insight ${x.lv}" data-go="#/project/${x.project}/insight/${x.id}">
          <div class="ii">${I.warn}</div>
          <div><h3>${x.title}</h3><p>${x.short}</p><div class="meta">${x.source} · ${x.time}${state.ack[id]?' · <span style="color:var(--cortex-deep)">Acknowledged</span>':''}</div></div>
          ${I.chev}</button>`}).join('')}</div>
      <a class="vall" data-go="#/projects" style="margin:0 24px 10px">View all projects ${I.chev}</a>
      <div class="quiet">${I.checkB.replace('19px','15px').replace('19px','15px')}Everything else is running to plan.</div>
    </div>
  </section>

  ${projectsCard()}

  <div class="noise"><button id="noiseBtn">339 events analyzed across Odoo and Email · 3 surfaced to you</button>
    <div class="glass filtered" id="filtered"><ul>${FILTERED.map(f=>`<li>${f[0]}<span>${f[1]}</span></li>`).join('')}</ul>
    <p>These events were analyzed but not surfaced because they had no meaningful executive impact.</p></div></div>
  </div>`;
}
function bindChart(){
  const svg=$('#chart svg'), tip=$('#tip'); if(!svg) return;
  svg.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('mouseenter',()=>{
      const i=+r.dataset.i; const a=i<=5?ACTUAL[i]:null, f=i>=5?FORECAST[i-5]:null;
      const box=r.getBBox(), sr=svg.getBoundingClientRect(), sc=sr.width/640;
      tip.style.left=(box.x+box.width/2)*sc+'px'; tip.style.top=(30)*sc+'px';
      tip.innerHTML=`<b>${MONTHS[i]}${i>=7?' 2027':' 2026'}</b>Plan ${PLAN[i]}% · ${a!=null&&i<5?'Actual '+a+'%':i===5?'Actual 52%':'Forecast '+f+'%'}`;
      tip.style.opacity=1;
      svg.querySelector('#hov').innerHTML=`<line x1="${box.x+box.width/2}" x2="${box.x+box.width/2}" y1="14" y2="202" stroke="rgba(23,26,44,.12)"/>`;
    });
    r.addEventListener('mouseleave',()=>{tip.style.opacity=0;svg.querySelector('#hov').innerHTML='';});
  });
}

/* ============================================================
   PROJECT DETAIL
   ============================================================ */
function ring(v,cls){const r=18,c=2*Math.PI*r;const col=cls==='r'?'#E5483B':cls==='a'?'#EDA930':'#3AAA60';
  return `<svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="rgba(23,26,44,.07)" stroke-width="5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 22 22)"/></svg>`;}
function msTimeline(p){
  const ms=p.milestones, s=p.start, endAll=new Date(Math.max(+p.fc,+p.end)+10*864e5);
  const span=endAll-s; const x=dt=>Math.max(0,Math.min(100,(dt-s)/span*100));
  const tx=x(TODAY);
  return `<div class="msl">`+ms.map((m,i)=>{
    const at=m[3]||m[1], cls=m[2]||'';
    const dates=m[3]?`<em class="${cls}">${fmt(m[1])} → ${fmt(m[3])}</em>`:`<span>${fmt(m[1])}${cls==='done'?' · done':''}</span>`;
    const slip=m[3]?`<div class="mslip ${cls}" style="left:${x(m[1])}%;width:${x(m[3])-x(m[1])}%"></div><div class="mghost" style="left:${x(m[1])}%"></div>`:'';
    return `<div class="msr ${cls}"><div class="mn"><i>${cls==='done'?'<svg class="ico" viewBox="0 0 24 24" style="width:10px;height:10px;stroke-width:3"><path d="M5 12l4 4 10-10"/></svg>':''}</i>${m[0]}</div>
      <div class="mtrack"><div class="mline"></div><div class="mdone" style="width:${Math.min(tx,x(at))}%"></div>${i===0?`<div class="mtoday lbl" style="left:${tx}%"></div>`:`<div class="mtoday" style="left:${tx}%"></div>`}${slip}<div class="mdot ${cls}" style="left:${x(at)}%"></div></div>
      <div class="md">${dates}</div></div>`}).join('')+`</div>`;
}
function hcard(icon,cls,label,val){return `<div class="glass hcard"><div class="si ${cls}">${icon}</div><div><span>${label}</span><b class="t-${cls==='n'?'g':cls}">${val}</b></div></div>`;}
function noteCard(p,ctx){
  const pm=p.people?p.people[0]:[p.owner,p.ownerRole,p.ini];
  const others=(p.people||[]).slice(1).filter(x=>!['Client','Client POC'].some(c=>x[1].startsWith(c)));
  const thread=(p.thread||[]).map(m=>`<div class="msg ${m.mine?'mine':''}"><div class="av ${m.mine?'':'pm'}">${m.mine?'P':p.ini}</div>
    <div class="bubble"><div class="bh"><b>${m.mine?'You':m.who}</b><span>${m.time}</span></div>${m.ctx?`<span class="ctx">Re: ${m.ctx}</span><br>`:''}${m.text}${m.status?`<div class="sent">${I.check.replace('class="ico"','class="ico" style="width:12px;height:12px"')}${m.status}</div>`:''}</div></div>`).join('');
  const ctxName = ctx?INSIGHTS[ctx].title.split(' — ')[1]:'';
  const healthy=p.h.overall==='g';
  if(healthy && !p._open){
    return `<div class="glass note" id="note"><div class="collapsed-note"><div><h2 style="font-size:17px;font-weight:600">Note to ${pm[0]}</h2><p style="font-size:13px;color:var(--muted)">Nothing needs action. You can still leave a note.</p></div><button class="btn" data-opennote>${I.msg}Write a note</button></div></div>`;
  }
  return `<div class="glass note" id="note">
    <div class="card-h"><div><h2 style="font-size:17px">Comment to ${pm[0].split(' ')[0]}</h2><p>${pm[1]} · sent in VINcortex and by email.</p></div></div>
    ${thread?`<div class="thread" id="thread">${thread}</div>`:''}
    <div class="compose">
      ${ctx?`<span class="ctxchip" id="ctxchip">${I.link.replace('class="ico"','class="ico" style="width:13px;height:13px"')}Re: ${ctxName}<button data-dropctx title="Remove">${I.x}</button></span>`:''}
      <textarea id="noteText" placeholder="Write a comment for ${pm[0].split(' ')[0]}…"></textarea>
      <div class="send-row"><button class="btn primary" id="sendNote" data-pid="${p.id}" data-ctx="${ctx||''}" disabled>Send comment</button></div>
      <div class="human">${I.lock}Sent only when you press Send.</div>
    </div>
  </div>`;
}
function renderProject(id,ctx,focus){
  const p=P(id); if(!p){go('#/');return;}
  const ov=OVER[p.h.overall];
  const healthy=p.h.overall==='g';
  const sc=p.h.schedule, cc=p.h.cost, pc=p.h.procurement, ec=p.h.execution;
  const ins=(p.insights||[]).map(i=>INSIGHTS[i]);
  const late=p.fc>p.end, slipD=Math.round((p.fc-p.end)/864e5);
  $('#app').innerHTML=`<div class="page">
    <div class="crumbs"><a data-go="#/projects">${I.back}Projects</a><span class="sep">/</span><b>${p.name}</b></div>
    <div class="ph"><div>
      <span class="pill ${ov[0]}"><i></i>${ov[1]}</span>
      <h1>${p.name}</h1>
      <div class="pm"><span>Client <b>${p.client}</b></span><span>Project manager <b>${p.owner}</b></span><span>Value <b>${p.value}</b></span></div>
    </div></div>
    <div class="pgrid">
      <div class="col">
        <div class="glass box psum">
          <p class="headline">${healthy?'Nothing here needs your attention.':p.why}</p>
          ${healthy?'':`<p class="impline">${p.impact[0]} ${p.impact[1]}</p>`}
          <div class="kfig">
            <div><span>Progress</span><b>${p.progress}%</b><div class="trk"><i class="${p.h.overall}" style="width:${p.progress}%"></i></div></div>
            <div><span>Forecast finish</span><b>${fmtY(p.fc)}</b><small class="${late?'late':''}">${late?'Planned '+fmt(p.end)+' · +'+slipD+' days':'On schedule'}</small></div>
          </div>
          <div class="hchips">
            ${[['Schedule',sc,p.t.schedule],['Cost',cc,p.t.cost],['Procurement',pc,p.t.procurement],['Execution',ec,p.t.execution]].map(h=>`<span><i class="${h[1]}"></i>${h[0]}<b>${h[2]}</b></span>`).join('')}
          </div>
          ${healthy?'':`<div class="next">${I.bulb}<div><span>Suggested next step</span><b>${p.next}</b></div></div>`}
        </div>
        <div class="glass box">
          <div class="card-h"><div><h2>Milestones</h2><p>${healthy?'Key dates':'Planned vs current forecast'}</p></div></div>
          ${msTimeline(p)}
        </div>
        ${ins.length?`<div class="glass box"><div class="card-h"><div><h2>Related alerts</h2></div></div>
          ${ins.map(x=>`<div class="ilink ${x.lv}" data-go="#/project/${p.id}/insight/${x.id}"><div class="ii">${I.warn.replace(/20px/g,'17px')}</div><div><b>${x.title}</b></div>${I.chev}</div>`).join('')}</div>`:''}
      </div>
      <div class="col">
        ${noteCard(p,ctx)}
      </div>
    </div>
  </div>`;
  bindNote();
  if(focus){setTimeout(()=>{const n=$('#note');if(n){n.scrollIntoView({behavior:'smooth',block:'center'});const t=$('#noteText');t&&t.focus({preventScroll:true});}},250);}
  else window.scrollTo({top:0});
}
function bindNote(){
  const t=$('#noteText'), b=$('#sendNote'); if(!t) return;
  t.addEventListener('input',()=>{b.disabled=!t.value.trim();});
}

/* ============================================================
   INSIGHT DETAIL (nested under project)
   ============================================================ */
function renderInsight(pid,iid){
  const x=INSIGHTS[iid], p=P(pid); if(!x||!p){go('#/');return;}
  const affected=(x.projects||[x.project]).map(P);
  const srcName=e=>e[0]==='odoo'?'ODOO':e[0]==='email'?'EMAIL':'PROJECT';
  $('#app').innerHTML=`<div class="page">
    <div class="crumbs"><a data-go="#/">${I.back}Dashboard</a><span class="sep">/</span><b>${x.title.split(' — ')[1]}</b></div>
    <div class="ihead" style="margin-bottom:18px">
      <span class="pill ${x.lv==='bad'?'r':'a'}"><i></i>${x.label}</span><span class="when" style="font-size:13px;color:var(--muted);margin-left:10px">${x.time}</span>
      <h1>${x.title}</h1>
    </div>
    <div class="idet2">
      <div class="main">
        <div class="glass box">
          <p class="headline">${x.happened}</p>
          <div class="facts">
            <div><h4>Why it matters</h4><p>${x.matters}</p></div>
            <div><h4>Potential impact</h4><p>${x.impact}</p></div>
          </div>
          <div class="next" style="margin-top:20px">${I.bulb}<div><span>Suggested next step</span><b>${x.next}</b></div></div>
        </div>
        <div class="glass box evflat">
          <h4>Evidence <span>${x.evidence.length} sources · ${x.source}</span></h4>
          ${x.evidence.map(e=>`<div class="evrow"><span class="src ${e[0]}">${srcName(e)}</span>
            <div><b>${e[1]}</b><span class="s">${e[2]}</span>
            <div class="kv">${e[3].slice(0,3).map(r=>`<span>${r[0]}: <em>${r[1]}</em></span>`).join('')}</div></div></div>`).join('')}
        </div>
      </div>
      <aside class="side actside">
        <div class="glass box">
          <h4>${affected.length>1?'Affected projects':'Project'}</h4>
          ${affected.map(a=>`<button class="pchip full" data-go="#/project/${a.id}"><i>${a.ini}</i><span><b>${a.name}</b><small>${a.owner} · ${OVER[a.h.overall][1]}</small></span>${I.chev}</button>`).join('')}
          <div class="act">
            ${affected.map(a=>`<button class="btn primary" data-go="#/project/${a.id}/comment/${x.id}">${I.msg}Comment to ${a.owner.split(' ')[0]}</button>`).join('')}
            <button class="btn ${state.ack[iid]?'done':''}" data-ack="${iid}">${state.ack[iid]?I.check+'Acknowledged':'Acknowledge'}</button>
          </div>
          <div class="human">${I.lock}VINcortex does not approve, change Odoo or send email on its own.</div>
        </div>
      </aside>
    </div>
  </div>`;
  window.scrollTo({top:0});
}

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  let nav='dash';
  if(h[0]==='project'&&h[2]==='insight'){renderInsight(h[1],h[3]);}
  else if(h[0]==='project'&&h[2]==='comment'){renderProject(h[1],h[3],true);nav='projects';}
  else if(h[0]==='project'){renderProject(h[1]);nav='projects';}
  else if(h[0]==='projects'){renderProjects();nav='projects';}
  else if(h[0]==='complaints'){renderComplaints();nav='complaints';}
  else renderOverview();
  renderNav(nav);
  if(!(h[0]==='project'&&h[2]==='comment')) window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);

function refreshGantt(id){
  const gw=document.querySelector(`.gw[data-id="${id}"]`); if(!gw) return;
  const p=P(id); gw.classList.toggle('open',!!state.open[id]);
  const m=gw.querySelector('.selmark'); if(state.sel[id]){m.style.left=pct(new Date(state.sel[id]))+'%';m.style.display='block';}else m.style.display='none';
  gw.querySelector('.gdet').outerHTML=ganttDetail(p);
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[data-pq]')){flt.q=t.value;refreshLists();}
  if(t.matches&&t.matches('[data-cq]')){state.cq=t.value;const l=document.getElementById('clist');if(l)l.innerHTML=complaintRows();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[data-fo]')){flt.owner=t.value;refreshLists();}
  if(t.matches&&t.matches('[data-fsort]')){flt.sort=t.value;refreshLists();}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.matches&&t.matches('[data-hq]')){flt.q=t.value;Object.assign(flt,{status:'all',owner:'all'});if(location.hash==='#/projects')route();else go('#/projects');}
});
document.addEventListener('mousemove',e=>{
  const tl=e.target.closest&&e.target.closest('.gw .tl');
  document.querySelectorAll('.hov.on').forEach(h=>{if(!tl||h.parentElement!==tl)h.classList.remove('on')});
  if(!tl) return;
  const r=tl.getBoundingClientRect(), frac=clamp((e.clientX-r.left)/r.width,0,1);
  const day=new Date(AXIS_START.getTime()+frac*(AXIS_END-AXIS_START));
  const h=tl.querySelector('.hov'); h.style.left=(frac*100)+'%'; h.classList.add('on');
  h.firstChild.textContent=fmt(day)+(Math.abs(dayDiff(day,TODAY))<1?' · today':'');
});
document.addEventListener('click',e=>{
  const t=e.target;
  const vw=t.closest('[data-v]'); if(vw){state.view=vw.dataset.v;state.page=1;document.querySelectorAll('#viewseg button').forEach(b=>b.classList.toggle('on',b===vw));$('#rows').innerHTML=portfolioBody();return;}
  if(t.closest('#noiseBtn')){$('#filtered').classList.toggle('open');return;}
  const ev=t.closest('[data-ev]'); if(ev){$('#ev'+ev.dataset.ev).classList.toggle('open');return;}
  const q=t.closest('[data-q]'); if(q){const ta=$('#noteText');ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+q.dataset.q;ta.focus();$('#sendNote').disabled=false;return;}
  if(t.closest('[data-dropctx]')){$('#ctxchip').remove();$('#sendNote').dataset.ctx='';return;}
  if(t.closest('[data-opennote]')){const id=location.hash.split('/')[2];P(id)._open=true;renderProject(id,null,true);return;}
  const ack=t.closest('[data-ack]'); if(ack){state.ack[ack.dataset.ack]=true;ack.className='btn done';ack.innerHTML=I.check+'Acknowledged';toast('Acknowledged. Nothing was changed in Odoo.');return;}
  const s=t.closest('#sendNote');
  if(s&&!s.disabled){
    const p=P(s.dataset.pid), text=$('#noteText').value.trim(), ctx=s.dataset.ctx;
    const cc=$('#ccBox')&&$('#ccBox').checked?p.people[1][0]:null;
    p.thread=p.thread||[];
    p.thread.push({who:'Pravin',mine:true,time:'Just now',text,ctx:ctx?INSIGHTS[ctx].title.split(' — ')[1]:'',status:'Sent to '+p.owner.split(' ')[0]+(cc?' · '+cc.split(' ')[0]+' notified':'')});
    renderProject(p.id,null,false);
    const th=$('#thread'); if(th) th.scrollTop=th.scrollHeight;
    $('#note').scrollIntoView({behavior:'smooth',block:'center'});
    toast('Comment sent to '+p.owner+'.');
    return;
  }
  const bt=t.closest('[data-today]'); if(bt){const id=bt.dataset.today;delete state.sel[id];refreshGantt(id);return;}
  const tlc=t.closest('.gw .tl'); if(tlc){const gw=tlc.closest('.gw'),id=gw.dataset.id,r=tlc.getBoundingClientRect();
    const frac=clamp((e.clientX-r.left)/r.width,0,1), day=new Date(AXIS_START.getTime()+frac*(AXIS_END-AXIS_START));day.setHours(0,0,0,0);
    state.sel[id]=day.getTime();state.open[id]=true;refreshGantt(id);return;}
  const pg=t.closest('[data-pg]'); if(pg&&!pg.disabled){state.page=+pg.dataset.pg;$('#rows').innerHTML=portfolioBody();return;}
  const lp=t.closest('[data-lp]'); if(lp&&!lp.disabled){state.lpage=+lp.dataset.lp;$('#lrows').innerHTML=listBody();return;}
  const fsb=t.closest('[data-fs]'); if(fsb){flt.status=fsb.dataset.fs;refreshLists();return;}
  const clr=t.closest('[data-clear]'); if(clr){Object.assign(flt,{q:'',status:'all',owner:'all',sort:'risk'});state.cq='';state.cf='all';route();return;}
  const cf=t.closest('[data-cf]'); if(cf){state.cf=cf.dataset.cf;renderComplaints();return;}
  const gx=t.closest('[data-gx]'); if(gx){const id=gx.dataset.gx;state.open[id]=!state.open[id];gx.parentElement.classList.toggle('open',!!state.open[id]);return;}
  const g=t.closest('[data-go]'); if(g){go(g.dataset.go);return;}
});

route();
</script>
